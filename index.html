<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator">
      <h1>Calculator</h1>

      <div
        id="display"
        class="display"
        role="status"
        aria-live="polite"
        aria-label="Calculator display"
      >
        0
      </div>

      <div class="keypad">
        <button type="button" data-action="clear" class="function-key">
          AC
        </button>
        <button type="button" data-action="sign" class="function-key">
          +/-
        </button>
        <button type="button" data-action="percent" class="function-key">
          %
        </button>
        <button type="button" data-operator="/" class="operator-key">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" data-operator="*" class="operator-key">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-operator="-" class="operator-key">−</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-operator="+" class="operator-key">+</button>

        <button type="button" data-action="backspace" class="function-key">
          ⌫
        </button>
        <button type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" data-action="equals" class="equals-key">=</button>
      </div>

      <p class="keyboard-help">
        Keyboard: numbers, +, -, *, /, Enter, Backspace, Escape
      </p>
    </main>
  </body>
</html>
